<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07142f"/>
      <stop offset=".5" stop-color="#0c2a66"/>
      <stop offset="1" stop-color="#10428f"/>
    </linearGradient>
    <radialGradient id="gl" cx="80%" cy="16%" r="62%">
      <stop offset="0" stop-color="#5ab0ff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#2b74d6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0c2a66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gl2" cx="58%" cy="104%" r="58%">
      <stop offset="0" stop-color="#2f8bff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#0c2a66" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <rect width="1600" height="500" fill="url(#nv)"/>

  <!-- raios de luz vindos do canto superior direito -->
  <g filter="url(#soft)" fill="#cfe6ff">
    <polygon points="1505,-40 1640,540 1400,540" opacity=".10"/>
    <polygon points="1505,-40 1410,560 1180,560" opacity=".08"/>
    <polygon points="1505,-40 1150,560 1000,560" opacity=".06"/>
    <polygon points="1505,-40 940,560 840,560" opacity=".045"/>
  </g>

  <!-- brilhos -->
  <rect width="1600" height="500" fill="url(#gl)"/>
  <rect width="1600" height="500" fill="url(#gl2)"/>

  <!-- anéis concêntricos no lado direito -->
  <g fill="none" stroke="#a9cbff">
    <circle cx="1285" cy="150" r="165" stroke-opacity=".15"/>
    <circle cx="1285" cy="150" r="265" stroke-opacity=".10"/>
    <circle cx="1285" cy="150" r="380" stroke-opacity=".07"/>
    <circle cx="1285" cy="150" r="510" stroke-opacity=".045"/>
  </g>

  <!-- partículas luminosas -->
  <g fill="#dcebff" filter="url(#soft2)">
    <circle cx="1120" cy="380" r="4" opacity=".7"/>
    <circle cx="985" cy="300" r="2.5" opacity=".5"/>
    <circle cx="1235" cy="430" r="3" opacity=".6"/>
    <circle cx="860" cy="425" r="2" opacity=".4"/>
    <circle cx="1380" cy="330" r="2.6" opacity=".5"/>
    <circle cx="1050" cy="205" r="2" opacity=".45"/>
    <circle cx="700" cy="365" r="2" opacity=".32"/>
    <circle cx="1320" cy="245" r="2.2" opacity=".4"/>
    <circle cx="900" cy="250" r="1.8" opacity=".3"/>
  </g>
</svg>
